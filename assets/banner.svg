<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A1F"/>
      <stop offset="45%" stop-color="#1B1440"/>
      <stop offset="78%" stop-color="#3B1666"/>
      <stop offset="100%" stop-color="#0B3D91"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F0A431" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F0A431" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0A431" stop-opacity="0"/>
      <stop offset="15%" stop-color="#F0A431" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#F0A431" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F0A431" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- faint dot grid, data/AI motif -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="40" r="1.6"/><circle cx="110" cy="70" r="1.6"/><circle cx="40" cy="110" r="1.6"/>
    <circle cx="150" cy="35" r="1.6"/><circle cx="90" cy="130" r="1.6"/><circle cx="160" cy="95" r="1.6"/>
    <circle cx="1080" cy="230" r="1.6"/><circle cx="1130" cy="200" r="1.6"/><circle cx="1150" cy="250" r="1.6"/>
    <circle cx="1040" cy="255" r="1.6"/><circle cx="1100" cy="160" r="1.6"/><circle cx="1160" cy="140" r="1.6"/>
  </g>

  <!-- route line: a journey/ride motif, echoing the KigaliRide project -->
  <path d="M 40 205 C 260 140, 420 250, 620 190 S 980 110, 1160 175"
        fill="none" stroke="url(#routeGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#soft)"/>
  <g fill="#F0A431">
    <circle cx="40" cy="205" r="4.5"/>
    <circle cx="620" cy="190" r="4.5"/>
    <circle cx="1160" cy="175" r="5.5"/>
    <circle cx="1160" cy="175" r="9" fill="none" stroke="#F0A431" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- name + tagline -->
  <text x="70" y="118" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#F0A431" font-weight="600">VANESSA ICYEZA</text>
  <text x="70" y="168" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="46" fill="#FFFFFF" font-weight="700">Software &amp; AI Engineer</text>
  <text x="70" y="204" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="19" fill="#C9CEE8">Robotics &#183; Data Science &#183; Model Training &#183; Full-Stack Development</text>
</svg>
